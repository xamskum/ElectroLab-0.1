<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroLab — Level 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; font-family: 'Segoe UI', system-ui, sans-serif; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    #ui > * { pointer-events: auto; }
    .hud {
      position: absolute; top: 16px; left: 16px;
      background: rgba(10,20,40,0.88); border: 1px solid #00d4ff44;
      border-radius: 8px; padding: 12px 16px; color: #e0f7ff; max-width: 360px;
    }
    .hud h2 { font-size: 12px; color: #00d4ff; margin-bottom: 6px; letter-spacing: 1.5px; text-transform: uppercase; }
    .hud p { font-size: 14px; line-height: 1.45; opacity: 0.95; }
    .btns { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btns button {
      background: rgba(10,20,40,0.88); border: 1px solid #00d4ff44; color: #e0f7ff;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }
    .btns button:hover { border-color: #00d4ff; background: rgba(0,212,255,0.12); }
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 10px; height: 10px; border: 2px solid #00d4ffaa; border-radius: 50%;
      pointer-events: none; box-shadow: 0 0 8px #00d4ff44;
    }
    #interact-prompt {
      position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); color: #fff; padding: 9px 18px;
      border-radius: 6px; font-size: 14px; display: none; border: 1px solid #00d4ff66;
      pointer-events: none; white-space: nowrap;
    }
    #level-badge {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(10,20,40,0.88); border: 1px solid #00d4ff44;
      border-radius: 8px; padding: 8px 12px; color: #00d4ff; font-size: 12px; letter-spacing: 1px;
    }
    #meter {
      position: absolute; bottom: 16px; right: 16px;
      background: rgba(10,20,40,0.88); border: 1px solid #00d4ff44;
      border-radius: 8px; padding: 8px 12px; color: #a8d4e8; font-size: 12px;
      font-family: ui-monospace, monospace; min-width: 130px; display: none;
    }
    #loading {
      position: absolute; inset: 0; background: #0a0e17; display: flex;
      align-items: center; justify-content: center; flex-direction: column;
      color: #00d4ff; z-index: 100; text-align: center; padding: 24px;
    }
    #loading h1 { font-size: 28px; letter-spacing: 5px; margin-bottom: 14px; font-weight: 600; }
    #loading p { opacity: 0.7; max-width: 420px; line-height: 1.5; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>ELECTROLAB</h1>
    <p>Загрузка лаборатории…</p>
  </div>
  <div id="app"></div>
  <div id="ui" style="display:none">
    <div class="hud">
      <h2>Задача</h2>
      <p id="task-text">Найди способ открыть дверь</p>
    </div>
    <div class="btns">
      <button id="btn-hint" type="button">Подсказка</button>
      <button id="btn-knowledge" type="button">Знания</button>
      <button id="btn-sound" type="button">🔊</button>
    </div>
    <div id="level-badge">LEVEL 1 · Первый контакт</div>
    <div id="meter">
      <div>I = <span id="m-i">—</span> A</div>
      <div>R = <span id="m-r">—</span> Ω</div>
      <div>P = <span id="m-p">—</span> W</div>
    </div>
    <div class="crosshair"></div>
    <div id="interact-prompt">E — взаимодействовать</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
